name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Verify deploy artifact
        shell: bash
        run: |
          test -f dist/index.html
          test -f dist/site-config.js
          grep -q './assets/' dist/index.html
          if grep -q '/src/main.tsx' dist/index.html; then
            echo 'dist/index.html still references the Vite development entrypoint.' >&2
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Wait for branch Pages deployment
        uses: actions/github-script@v7
        with:
          script: |
            const targetSha = context.sha;

            for (let attempt = 1; attempt <= 12; attempt += 1) {
              const { data } = await github.rest.actions.listWorkflowRunsForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 30,
              });
              const legacyRun = data.workflow_runs.find((run) =>
                run.name === 'pages build and deployment' && run.head_sha === targetSha
              );

              if (legacyRun?.status === 'completed') {
                core.info(`Branch Pages deployment finished with: ${legacyRun.conclusion}`);
                return;
              }

              core.info(`Waiting for branch Pages deployment (${attempt}/12)`);
              await new Promise((resolve) => setTimeout(resolve, 5000));
            }

            core.warning('No completed branch Pages deployment was found; continuing with the compiled deployment.');

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
